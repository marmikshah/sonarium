name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      bench:
        description: Run the report-only Criterion benchmarks
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
        if: github.event_name != 'schedule'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: github.event_name != 'schedule'
      - uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            python:
              - "crates/tono-core/**"
              - "crates/tono-play/**"
              - "crates/tono-py/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
      - name: Check formatting
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.bench)
        run: cargo fmt --all -- --check
      - name: Lint
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.bench)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.bench)
        run: cargo test --locked
      - uses: actions/setup-python@v5
        if: (github.event_name == 'pull_request' && steps.changes.outputs.python == 'true') || (github.event_name == 'workflow_dispatch' && !inputs.bench)
        with:
          python-version: "3.9"
      - name: Install Python build dependencies
        if: (github.event_name == 'pull_request' && steps.changes.outputs.python == 'true') || (github.event_name == 'workflow_dispatch' && !inputs.bench)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
          python3 -m pip install --upgrade pip maturin numpy
      - name: Build and test the installed Python extension
        if: (github.event_name == 'pull_request' && steps.changes.outputs.python == 'true') || (github.event_name == 'workflow_dispatch' && !inputs.bench)
        run: |
          maturin build --out dist -m crates/tono-py/Cargo.toml
          python3 -m pip install --no-index --find-links dist --force-reinstall --no-deps tono
          python3 crates/tono-py/tests/smoke.py
          python3 crates/tono-py/tests/test_typed.py
      - name: Check dependency advisories and licenses
        if: github.event_name != 'workflow_dispatch' || !inputs.bench
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
      - name: Run report-only benchmarks
        if: github.event_name == 'workflow_dispatch' && inputs.bench
        run: cargo bench --locked -p tono-core 2>&1 | tee bench.txt
      - name: Summarize benchmark results
        if: github.event_name == 'workflow_dispatch' && inputs.bench
        run: |
          {
            echo "### Criterion (report-only — no gate)"
            echo '```'
            grep -E '^[a-z_]+/[a-z_0-9]+|time:|change:' bench.txt | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.bench
        with:
          name: criterion-report
          path: |
            bench.txt
            target/criterion
          retention-days: 30
