name: CI

# One PR gate, one job, one command: `make ci` (fmt --check + clippy
# (-D warnings) + tests) — the exact thing the pre-push hook runs, so a
# pushed head has already proven it locally. Runs on non-draft PRs and on
# master. Everything heavier (macOS native crates, Python wheel smoke,
# benches) is validated on master pushes via their own
# workflows, not per-PR — hosted minutes are spent where they change
# outcomes.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    # Non-draft PRs and master pushes (on master the draft field is undefined,
    # so the condition must pass on the push event explicitly).
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # The pinned production toolchain comes from rust-toolchain.toml (1.88.0);
    # the golden corpus's per-platform pins (engine ≤ 4) are validated on this
    # runner's matching platform only — ubuntu-linux covers the linux set, the
    # macOS set is covered by the Native workflow on master.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: make ci

