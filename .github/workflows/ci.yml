name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    # Both pinned golden-corpus platforms: the per-platform render hashes
    # (macos-aarch64 vs linux-x86_64) must each be CI-validated. The pinned
    # production toolchain comes from rust-toolchain.toml (1.88.0).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Verify
        # The one gate — identical to the pre-push hook and `make verify`.
        run: make verify

  stable-compat:
    # The future, tested separately from the pinned production toolchain:
    # latest stable, so an upstream regression or a stabilization we rely on
    # surfaces early instead of on release day. RUSTUP_TOOLCHAIN overrides
    # the rust-toolchain.toml pin for this job only.
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify on latest stable
        run: make verify

  build-wasm:
    # The WASM face on the fast path: build-only (no browser tests, keeping
    # the fast path fast). Compiling tono-core + tono-wasm to the supported
    # wasm32 target on every push/PR is what covers core/runtime changes for
    # the browser face — per-job path filters aren't a house pattern (the
    # Native workflow gates at the workflow level instead), and this job is
    # cheap enough to always run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the WASM face
        run: cargo build --locked -p tono-wasm --target wasm32-unknown-unknown
