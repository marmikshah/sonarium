name: Bench

# Report-only performance signal for the tono-core render hot path: runs the
# criterion suite on core-touching PRs and publishes the numbers, but never
# gates. Shared CI runners are too noisy for a hard threshold — a regression
# should be made visible in the PR, not block it (controlled-runner baselines
# are their own workstream).

on:
  pull_request:
    paths:
      - "crates/tono-core/**"
      - ".github/workflows/bench.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  criterion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the criterion benches
        run: cargo bench -p tono-core 2>&1 | tee bench.txt
      - name: Summarize the results
        run: |
          {
            echo "### Criterion (report-only — no gate)"
            echo '```'
            grep -E '^[a-z_]+/[a-z_0-9]+|time:|change:' bench.txt | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: |
            bench.txt
            target/criterion
          retention-days: 30
