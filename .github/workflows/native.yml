name: Native

# Cross-platform confirmation for the off-default native crates on macOS,
# where CoreAudio requires no extra host packages.

on:
  push:
    branches: [master]
    paths:
      - "crates/tono-desktop/**"
      - "crates/tono-play/**"
      - "crates/tono-py/**"
      - "crates/tono-core/**"
      - ".github/workflows/native.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify the native crates
        run: |
          cargo clippy --locked -p tono-desktop -p tono-play -p tono-py --all-targets -- -D warnings
          cargo test --locked -p tono-desktop -p tono-play
