name: Master

# Master-push validation beyond the one-job PR gate: the future stable and
# the browser face, validated where they land before a release.

on:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  stable-compat:
    # The future, tested separately from the pinned production toolchain:
    # latest stable, so an upstream regression or a stabilization we rely on
    # surfaces early instead of on release day. RUSTUP_TOOLCHAIN overrides
    # the rust-toolchain.toml pin for this job only. Master pushes only —
    # the PR gate is the single `ci` job.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify on latest stable
        run: make ci
