# The production toolchain (issue #52, WS9): every developer machine and CI
# job builds with this exact compiler, so a build is reproducible down to the
# rustc. It tracks the workspace MSRV (rust-version in Cargo.toml) — bump them
# together. The latest stable is tested separately (the `stable-compat` CI
# job, which overrides this pin via RUSTUP_TOOLCHAIN) so future breakage
# surfaces early instead of on release day.
[toolchain]
channel = "1.88.0"
components = ["clippy", "rustfmt"]
