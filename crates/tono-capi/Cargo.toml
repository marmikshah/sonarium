[package]
name = "tono-capi"
description = "A stable C ABI for tono — opaque handles over a compiled Program and its Performance runtime, for native hosts (game engines, embedded). See capi.h."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# cdylib + staticlib only: this crate IS the C ABI — there is no Rust-facing
# rlib surface to link against (Rust consumers use tono-core directly).
crate-type = ["cdylib", "staticlib"]

[dependencies]
tono-core = { workspace = true }
serde_json = { workspace = true }
