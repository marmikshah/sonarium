[package]
name = "tono-wasm"
description = "The WebAssembly face of tono — render SoundDocs, compile Songs into Programs, and drive a live Performance from an AudioWorklet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# A cdylib for wasm32-unknown-unknown, not a crates.io library: built via
# `make wasm` and shipped as the compiled .wasm + JS bindings.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Lean build, documented in this crate's README: `analysis` (the image crate —
# PNG spectrograms/waveforms) and `sampler` (rustysynth + .sf2 file I/O) stay
# off; neither belongs in a browser sandbox. What remains — serde, serde_json,
# schemars, tracing, rustfft — is pure Rust and compiles to wasm32. Sampler
# tracks render silence, exactly like a native lean build.
tono-core = { path = "../tono-core", version = "1.9.0", default-features = false }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
